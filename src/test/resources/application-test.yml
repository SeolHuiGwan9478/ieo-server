# 테스트 전용: 메모리 H2 (테스트가 끝나면 사라짐)
spring:
  datasource:
    url: jdbc:h2:mem:ieo-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

ieo:
  # 리포트에서 노선·상하차지를 보여 주는 최소 건수 (BRK-044는 10, 데이터가 적은 동안 낮춤)
  report:
    min-samples: 2
  jwt:
    secret: test-only-secret-0123456789-abcdefghij
  vin:
    hash-secret: test-only-vin-secret
  cors:
    allowed-origins: http://localhost:5173
  storage:
    local-dir: build/test-files

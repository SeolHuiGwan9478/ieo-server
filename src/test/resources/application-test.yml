# 테스트 전용: 내 컴퓨터의 PostgreSQL + PostGIS (ieo_test DB). 테스트가 시작할 때 테이블을 새로 만든다
# 처음 한 번: createdb ieo_test && psql -d ieo_test -c 'CREATE EXTENSION IF NOT EXISTS postgis'
# 접속 정보가 다르면 TEST_DB_URL, TEST_DB_USERNAME, TEST_DB_PASSWORD 환경변수로 바꾼다
# 개발용 ieo DB나 배포 DB를 가리키지 않게 한다 (테스트가 테이블을 지운다)
# Windows: ${USER}가 없어서 .env(커밋 안 됨)의 DB_USERNAME·DB_PASSWORD를 대신 쓴다. TEST_DB_*가 있으면 그게 우선
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/ieo_test}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:${USER}}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: create-drop

ieo:
  # 리포트에서 노선·상하차지를 보여 주는 최소 건수 (BRK-044는 10, 데이터가 적은 동안 낮춤)
  report:
    min-samples: 2
  jwt:
    secret: test-only-secret-0123456789-abcdefghij
  vin:
    hash-secret: test-only-vin-secret
  cors:
    allowed-origins: http://localhost:5173
  storage:
    local-dir: build/test-files
  # .env의 OPINET_API_KEY를 쓰지 않는다. 키가 있으면 실제 경유가를 받아 와 기름값 계산 테스트가 날마다 달라진다
  opinet:
    api-key: ""
  # 국세청 진위확인은 시연용 스텁으로 (사업자번호 아홉째 자리로 결과가 정해진다). .env의 NTS_SERVICE_KEY가 있어도 쓰지 않는다
  nts:
    service-key: ""
    stub: true
  # 오더를 만드는 테스트마다 회사 서류를 승인해 두지 않도록 게이트를 끈다. AdminBrokerDocumentControllerTest만 켜서 검사한다
  review:
    gate-broker-orders: false

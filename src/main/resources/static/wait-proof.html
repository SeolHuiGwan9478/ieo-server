<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>대기 증빙 · 이에오</title>
<!--
  주선사가 보는 대기 증빙 페이지 (WAIT-020, 025). 차주가 보낸 링크로 열린다: /w/{token}
  운행 하나에 링크 하나: 상차지·하차지 대기 기록을 함께 보여 준다. 로그인 없이 열리고 데이터는 /api/public/wait-proofs/{token}.
  기사님이 확인하거나 누른 순간만 시각·상하차지와의 거리·방법으로 보여 준다. 누르지 않은 순간은 비어 있다.
  아직 끝나지 않은 곳이 있으면 1분마다 새로 받는다.
-->
<style>
:root {
  --orange: #FF6C37; --orange-text: #C2410C; --orange-pale: #FFF3EE;
  --canvas: #F2F4F6; --white: #FFFFFF; --strong: #191F28; --mid: #4E5968; --sub: #8B95A1;
  --line: #E5E8EB; --done: #16A34A; --done-pale: #DCFCE7; --wait: #A16207; --wait-pale: #FEF9C3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--canvas); color: var(--strong);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; align-items: center; gap: 8px; padding: 4px 4px 16px; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--orange); }
header span { color: var(--sub); font-size: 14px; }
section { background: var(--white); border-radius: 20px; padding: 20px; margin-bottom: 12px; }
h1 { font-size: 24px; line-height: 1.35; font-weight: 800; letter-spacing: -0.4px; }
h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
.lead { color: var(--mid); margin-top: 4px; }
.tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
.tag.wait { background: var(--wait-pale); color: var(--wait); }
.tag.work { background: var(--orange-pale); color: var(--orange-text); }
.tag.done { background: var(--done-pale); color: var(--done); }
.big { display: flex; gap: 12px; margin-top: 16px; }
.big div { flex: 1; background: var(--canvas); border-radius: 14px; padding: 14px; }
.big dt { color: var(--sub); font-size: 14px; }
.big dd { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.big dd.money { color: var(--orange-text); }
.row { display: flex; gap: 12px; padding: 7px 0; }
.row dt { width: 96px; flex-shrink: 0; color: var(--sub); }
.row dd { font-weight: 500; font-variant-numeric: tabular-nums; word-break: keep-all; }
.timeline { list-style: none; position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.timeline li { position: relative; padding: 6px 0; display: flex; justify-content: space-between; gap: 12px; }
.timeline li::before {
  content: ""; position: absolute; left: -22px; top: 13px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--white); border: 2px solid var(--sub);
}
.timeline li.on::before { border-color: var(--orange); background: var(--orange); }
.timeline .label { color: var(--mid); }
.timeline .time { font-weight: 600; font-variant-numeric: tabular-nums; }
.timeline li.off .time { color: var(--sub); font-weight: 400; }
.note { color: var(--sub); font-size: 14px; margin-top: 10px; }
.edited { background: var(--canvas); border-radius: 12px; padding: 12px 14px; margin-top: 12px; color: var(--mid); font-size: 14px; }
.center { text-align: center; padding: 48px 20px; }
.muted { color: var(--sub); font-size: 14px; }
.ev { list-style: none; margin-top: 4px; }
.ev li { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.ev li:first-child { border-top: 0; }
.ev .at { width: 92px; flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.ev .what { font-weight: 600; }
.ev .how { color: var(--mid); font-size: 14px; }
.ev .late { color: var(--wait); font-size: 13px; }
.empty { color: var(--sub); font-size: 14px; padding: 6px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><span class="logo">ieo.</span><span>대기 증빙</span></header>

  <div id="loading" class="center muted">불러오는 중…</div>

  <section id="failed" class="center" hidden>
    <h1>대기 증빙을 열 수 없어요</h1>
    <p class="lead" id="failed-reason">링크가 만료되었거나 잘못된 주소예요. 기사님께 링크를 다시 받아 주세요.</p>
  </section>

  <div id="content" hidden>
    <section>
      <h2>운행</h2>
      <dl>
        <div class="row"><dt>차량</dt><dd id="plate"></dd></div>
        <div class="row"><dt>운송사</dt><dd id="broker"></dd></div>
      </dl>
      <p class="note" id="issued"></p>
    </section>
    <div id="stops"></div>
    <p class="note">기사님이 확인하거나 누른 순간만 기록해요. 위치는 그 순간 차와 상하차지 사이 거리예요.</p>
  </div>
</main>

<template id="stop-template">
  <section>
    <span class="tag"></span>
    <h1 class="site-name"></h1>
    <p class="lead site-address"></p>
    <dl class="big">
      <div><dt class="wait-label">대기 시간</dt><dd class="wait-minutes">-</dd></div>
      <div><dt class="fee-label">청구 대기비</dt><dd class="fee money">-</dd></div>
    </dl>
    <p class="note fee-note"></p>
    <h2 style="margin-top:20px">기록</h2>
    <ul class="ev"></ul>
    <p class="note planned-note" hidden>예정 시각이 없어 대기 시작부터 대기비를 계산했어요.</p>
    <div class="edited" hidden></div>
    <dl style="margin-top:8px">
      <div class="row"><dt>예정 시각</dt><dd class="planned">-</dd></div>
      <div class="row"><dt>대기비 기준</dt><dd class="policy">-</dd></div>
      <div class="row"><dt>작업 시간</dt><dd class="work-minutes">-</dd></div>
    </dl>
  </section>
</template>

<script>
(() => {
  const REFRESH_MILLIS = 60_000;
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const api = '/api/public/wait-proofs/' + encodeURIComponent(token);
  const $ = (id) => document.getElementById(id);

  const dayTime = new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
  });
  const time = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
  const won = (n) => n.toLocaleString('ko-KR') + '원';
  const SOURCE = {
    CONFIRM_TOUCH: '앱이 묻고 화면으로 확인', CONFIRM_VOICE: '앱이 묻고 말로 확인',
    BUTTON: '버튼을 직접 누름', VOICE: '음성 명령', AUTO: '자동 기록',
  };

  function minutesText(minutes) {
    if (minutes == null) return '-';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h === 0) return m + '분';
    return m === 0 ? h + '시간' : `${h}시간 ${m}분`;
  }

  function minutesBetween(from, to) {
    return Math.max(0, Math.floor((new Date(to) - new Date(from)) / 60000));
  }

  // 서버 WaitPolicy와 같은 계산. 아직 작업 전일 때 "지금까지" 금액을 보여 주는 데만 쓴다
  function estimate(policy, chargeableMinutes) {
    const over = chargeableMinutes - policy.freeMinutes;
    if (over <= 0) return 0;
    const units = policy.rounding === 'DOWN' ? Math.floor(over / policy.unitMinutes) : Math.ceil(over / policy.unitMinutes);
    return Math.min(units * policy.unitAmount, policy.maxAmount);
  }

  function eventLabel(type, work) {
    if (type === 'ARRIVED') return '대기 시작';
    if (type === 'WORK_STARTED') return `${work} 시작`;
    return '떠남';
  }

  function renderStop(stop) {
    const r = stop.record;
    const work = r.stopType === 'PICKUP' ? '상차' : '하차';
    const el = $('stop-template').content.firstElementChild.cloneNode(true);
    const q = (sel) => el.querySelector(sel);

    const tag = q('.tag');
    if (r.status === 'WAITING') { tag.className = 'tag wait'; tag.textContent = `${work}지 대기 중`; }
    else if (r.status === 'WORKING') { tag.className = 'tag work'; tag.textContent = `${work} 중`; }
    else { tag.className = 'tag done'; tag.textContent = `${work}지 끝`; }
    q('.site-name').textContent = r.siteName;
    q('.site-address').textContent = stop.siteAddress || '';

    // 작업 전이면 대기가 아직 이어지고 있어 지금 시각까지로 센다
    const live = r.status === 'WAITING';
    q('.wait-label').textContent = live ? '지금까지 대기' : '대기 시간';
    q('.wait-minutes').textContent = minutesText(live ? minutesBetween(r.arrivedAt, Date.now()) : r.waitMinutes);
    const policy = r.policy;
    if (!policy) {
      q('.fee-label').textContent = '대기비';
      q('.fee-note').textContent = '대기비 기준이 정해지지 않아 시간만 기록했어요.';
      q('.policy').textContent = '없음';
    } else {
      const amount = live ? estimate(policy, minutesBetween(r.chargeableFrom, Date.now())) : r.chargeableAmount;
      q('.fee-label').textContent = live ? '지금까지 대기비' : '청구 대기비';
      q('.fee').textContent = amount == null ? '-' : won(amount);
      q('.fee-note').textContent = live ? `${work}을 시작하면 금액이 정해져요.`
        : (r.workStartedAt ? '' : `${work} 시작 기록이 없어 대기와 작업을 나눌 수 없었어요.`);
      q('.policy').textContent =
        `무료 ${minutesText(policy.freeMinutes)}, ${policy.unitMinutes}분마다 ${won(policy.unitAmount)} (최대 ${won(policy.maxAmount)})`;
    }

    const list = q('.ev');
    if (!stop.events.length) {
      // 이 기능 전에 만든 기록은 순간 목록이 없다. 시각만 보여 준다
      [['ARRIVED', r.arrivedAt], ['WORK_STARTED', r.workStartedAt], ['DEPARTED', r.departedAt]]
        .filter(([, at]) => at)
        .forEach(([type, at]) => list.appendChild(eventItem({ type, at, distanceMeters: null, source: null, sentLate: false }, work)));
    } else {
      // 이 기능 전에 시작한 대기는 대기 시작 순간이 목록에 없다. 기록된 시각으로 채운다
      if (!stop.events.some((event) => event.type === 'ARRIVED')) {
        list.appendChild(eventItem({ type: 'ARRIVED', at: r.arrivedAt, distanceMeters: null, source: null, sentLate: false }, work));
      }
      stop.events.forEach((event) => list.appendChild(eventItem(event, work)));
    }
    if (!list.children.length) list.innerHTML = '<li class="empty">아직 기록이 없어요</li>';

    q('.planned').textContent = r.plannedAt ? dayTime.format(new Date(r.plannedAt)) : '없음';
    q('.planned-note').hidden = !r.plannedAtMissing;
    q('.work-minutes').textContent = minutesText(r.workMinutes);

    // 고친 시각은 숨기지 않고 처음 값을 같이 보여 준다. 위 기록은 고치기 전 그대로다
    const edited = q('.edited');
    edited.hidden = !r.edited;
    if (r.edited && r.original) {
      const o = r.original;
      const parts = [
        o.arrivedAt && `대기 시작 ${dayTime.format(new Date(o.arrivedAt))}`,
        o.workStartedAt && `${work} 시작 ${dayTime.format(new Date(o.workStartedAt))}`,
        o.departedAt && `떠남 ${dayTime.format(new Date(o.departedAt))}`,
      ].filter(Boolean);
      const now = [
        `대기 시작 ${dayTime.format(new Date(r.arrivedAt))}`,
        r.workStartedAt && `${work} 시작 ${dayTime.format(new Date(r.workStartedAt))}`,
        r.departedAt && `떠남 ${dayTime.format(new Date(r.departedAt))}`,
      ].filter(Boolean);
      edited.textContent = `기사님이 ${r.editedAt ? dayTime.format(new Date(r.editedAt)) : ''}에 시각을 고쳤어요. 고친 시각: ${now.join(', ')} · 처음 기록: ${parts.join(', ')}`;
    }
    return el;
  }

  function eventItem(event, work) {
    const li = document.createElement('li');
    const at = document.createElement('span');
    at.className = 'at';
    at.textContent = time.format(new Date(event.at));
    const body = document.createElement('div');
    const what = document.createElement('div');
    what.className = 'what';
    what.textContent = eventLabel(event.type, work) + (event.distanceMeters != null ? ` · ${work}지에서 ${event.distanceMeters.toLocaleString('ko-KR')}m` : '');
    body.appendChild(what);
    if (event.source) {
      const how = document.createElement('div');
      how.className = 'how';
      how.textContent = SOURCE[event.source] || '';
      body.appendChild(how);
    }
    if (event.sentLate) {
      const late = document.createElement('div');
      late.className = 'late';
      late.textContent = '통신이 끊겨 나중에 보낸 기록';
      body.appendChild(late);
    }
    li.append(at, body);
    return li;
  }

  function render(proof) {
    $('loading').hidden = true;
    $('content').hidden = false;
    $('plate').textContent = proof.plateNumber;
    $('broker').textContent = proof.brokerName || '-';
    $('issued').textContent = `증빙 발급 ${dayTime.format(new Date(proof.issuedAt))}`;
    const stops = $('stops');
    stops.replaceChildren(...proof.stops.map(renderStop));
    if (proof.stops.some((stop) => stop.record.status !== 'DONE')) setTimeout(load, REFRESH_MILLIS);
  }

  function fail(message) {
    $('loading').hidden = true;
    $('content').hidden = true;
    $('failed').hidden = false;
    if (message) $('failed-reason').textContent = message;
  }

  async function load() {
    try {
      const res = await fetch(api);
      const body = await res.json().catch(() => null);
      if (!res.ok) throw new Error(body && body.message ? body.message : null);
      render(body);
    } catch (err) {
      fail(err.message);
    }
  }

  if (!token) fail(); else load();
})();
</script>
</body>
</html>

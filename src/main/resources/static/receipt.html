<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>인수증 서명 · 이에오</title>
<!--
  수하인 전자인수증 페이지 (POD-004, 005, 006). 차량 화면의 QR로 열린다: /r/{token}
  앱 설치·로그인 없이 운행 정보를 보고 서명한다. 데이터는 /api/public/delivery-proofs/{token}에서 받는다.
-->
<style>
:root {
  --orange: #FF6C37; --orange-btn: #F25A22; --orange-text: #C2410C; --orange-pale: #FFF3EE;
  --canvas: #F2F4F6; --white: #FFFFFF; --strong: #191F28; --mid: #4E5968; --sub: #8B95A1;
  --line: #E5E8EB; --done: #16A34A; --done-pale: #DCFCE7; --error: #DC2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--canvas); color: var(--strong);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; align-items: center; gap: 8px; padding: 4px 4px 16px; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--orange); }
header span { color: var(--sub); font-size: 14px; }
section { background: var(--white); border-radius: 20px; padding: 20px; margin-bottom: 12px; }
h1 { font-size: 24px; line-height: 1.35; font-weight: 800; letter-spacing: -0.4px; }
h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
.lead { color: var(--mid); margin-top: 8px; }
.row { display: flex; gap: 12px; padding: 6px 0; }
.row dt { width: 72px; flex-shrink: 0; color: var(--sub); }
.row dd { font-weight: 500; word-break: keep-all; }
label { display: block; font-size: 15px; color: var(--mid); margin-bottom: 6px; }
input[type=text], textarea {
  width: 100%; font: inherit; font-size: 17px; color: var(--strong);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--white);
}
input[type=text]:focus, textarea:focus { outline: 2px solid var(--orange); border-color: transparent; }
textarea { min-height: 84px; resize: vertical; }
.field + .field { margin-top: 16px; }
.pad-wrap { position: relative; border: 1px dashed var(--sub); border-radius: 14px; background: #FAFBFC; touch-action: none; }
canvas { display: block; width: 100%; height: 200px; border-radius: 14px; }
.pad-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); pointer-events: none; }
.pad-tools { display: flex; justify-content: flex-end; margin-top: 8px; }
.text-btn { background: none; border: 0; color: var(--mid); font: inherit; font-size: 15px; padding: 6px 4px; cursor: pointer; }
.primary {
  width: 100%; border: 0; border-radius: 16px; padding: 17px; margin-top: 4px;
  background: var(--orange-btn); color: var(--white); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
}
.primary:disabled { background: var(--line); color: var(--sub); cursor: default; }
.secondary {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--white); color: var(--mid); font: inherit; font-size: 15px; padding: 10px 14px; cursor: pointer;
}
.photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.photos img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--canvas); }
.check { display: flex; gap: 10px; align-items: flex-start; color: var(--mid); font-size: 15px; margin-top: 14px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--orange-btn); flex-shrink: 0; }
.error { color: var(--error); font-size: 15px; margin-top: 10px; min-height: 1px; }
.tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
.tag.wait { background: var(--orange-pale); color: var(--orange-text); }
.tag.done { background: var(--done-pale); color: var(--done); }
.signature-img { width: 100%; max-height: 180px; object-fit: contain; background: #FAFBFC; border-radius: 12px; margin-top: 8px; }
.muted { color: var(--sub); font-size: 14px; }
.center { text-align: center; padding: 48px 20px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><span class="logo">ieo.</span><span>전자인수증</span></header>

  <div id="loading" class="center muted">불러오는 중…</div>

  <section id="failed" class="center" hidden>
    <h1>인수증을 열 수 없어요</h1>
    <p class="lead" id="failed-reason">링크가 만료되었거나 잘못된 주소예요. 기사님께 QR을 다시 보여 달라고 해 주세요.</p>
  </section>

  <div id="content" hidden>
    <section>
      <span id="status-tag" class="tag wait">서명 전</span>
      <h1 id="title">물건을 받으셨다면<br>서명해 주세요</h1>
      <p class="lead" id="lead">서명하면 기사님과 운송사에 인수 확인이 전달돼요.</p>
    </section>

    <section>
      <h2>운행 정보</h2>
      <dl>
        <div class="row"><dt>상차지</dt><dd id="pickup"></dd></div>
        <div class="row"><dt>하차지</dt><dd id="dropoff"></dd></div>
        <div class="row" id="cargo-row"><dt>화물</dt><dd id="cargo"></dd></div>
        <div class="row"><dt>차량</dt><dd id="plate"></dd></div>
        <div class="row"><dt>운송사</dt><dd id="broker"></dd></div>
      </dl>
    </section>

    <form id="sign-form" novalidate>
      <section>
        <h2>이상 사항 <span class="muted">(없으면 비워 두세요)</span></h2>
        <div class="field">
          <label for="note">파손, 수량 부족 등</label>
          <textarea id="note" maxlength="500" placeholder="예: 상자 2개 모서리 찌그러짐"></textarea>
        </div>
        <div class="field">
          <input type="file" id="photo-input" accept="image/jpeg,image/png" capture="environment" hidden>
          <button type="button" class="secondary" id="photo-btn">사진 올리기</button>
          <span class="muted" id="photo-count"></span>
          <div class="photos" id="photos"></div>
        </div>
      </section>

      <section>
        <h2>서명</h2>
        <div class="field">
          <label for="name">받는 분 성함</label>
          <input type="text" id="name" maxlength="30" autocomplete="name" placeholder="홍길동">
        </div>
        <div class="field">
          <label>아래 칸에 서명해 주세요</label>
          <div class="pad-wrap">
            <canvas id="pad" aria-label="서명 칸"></canvas>
            <div class="pad-hint" id="pad-hint">여기에 손가락으로 서명</div>
          </div>
          <div class="pad-tools"><button type="button" class="text-btn" id="clear">다시 쓰기</button></div>
        </div>
        <label class="check"><input type="checkbox" id="share-location">서명한 위치를 함께 남깁니다 (선택)</label>
        <p class="error" id="error" role="alert"></p>
        <button type="submit" class="primary" id="submit" disabled>서명하고 인수 확인</button>
      </section>
    </form>

    <section id="signed" hidden>
      <h2>서명</h2>
      <dl>
        <div class="row"><dt>받는 분</dt><dd id="signer"></dd></div>
        <div class="row"><dt>서명 시각</dt><dd id="signed-at"></dd></div>
        <div class="row" id="signed-note-row" hidden><dt>이상 사항</dt><dd id="signed-note"></dd></div>
      </dl>
      <img class="signature-img" id="signature-img" alt="서명">
      <div class="photos" id="signed-photos"></div>
    </section>
  </div>
</main>

<script>
(() => {
  const MAX_PHOTOS = 5;
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const api = '/api/public/delivery-proofs/' + encodeURIComponent(token);
  const $ = (id) => document.getElementById(id);
  let photoCount = 0;

  const timeFormat = new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
  });

  async function request(url, options) {
    const res = await fetch(url, options);
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(body && body.message ? body.message : '잠시 후 다시 시도해 주세요.');
    return body;
  }

  function render(proof) {
    $('loading').hidden = true;
    $('content').hidden = false;
    $('pickup').textContent = proof.pickupSiteName;
    $('dropoff').textContent = proof.dropoffSiteName + (proof.dropoffAddress ? ' · ' + proof.dropoffAddress : '');
    const cargo = [proof.cargoType, proof.weightKg ? proof.weightKg.toLocaleString('ko-KR') + 'kg' : null].filter(Boolean).join(' · ');
    $('cargo-row').hidden = !cargo;
    $('cargo').textContent = cargo;
    $('plate').textContent = proof.plateNumber;
    $('broker').textContent = proof.brokerName || '-';
    photoCount = (proof.photos || []).filter((p) => p.type === 'ISSUE').length;
    updatePhotoCount();

    const confirmed = proof.status !== 'PENDING';
    $('sign-form').hidden = confirmed;
    $('signed').hidden = !confirmed;
    if (!confirmed) return;

    $('status-tag').className = 'tag done';
    $('status-tag').textContent = '인수 확인됨';
    if (proof.status === 'PHOTO') {
      $('title').textContent = '종이 인수증으로 확인했어요';
      $('lead').textContent = '기사님이 종이 인수증 사진을 올렸어요.';
      $('signed').hidden = true;
      return;
    }
    $('title').textContent = '서명을 받았어요';
    $('lead').textContent = '감사합니다. 이 창은 닫으셔도 돼요.';
    $('signer').textContent = proof.signerName || '-';
    $('signed-at').textContent = proof.signedAt ? timeFormat.format(new Date(proof.signedAt)) : '-';
    $('signed-note-row').hidden = !proof.issueNote;
    $('signed-note').textContent = proof.issueNote || '';
    $('signature-img').src = proof.signaturePath;
    const box = $('signed-photos');
    box.replaceChildren(...(proof.photos || []).map((p) => {
      const img = document.createElement('img');
      img.src = p.path;
      img.alt = '이상 사항 사진';
      return img;
    }));
  }

  function fail(message) {
    $('loading').hidden = true;
    $('content').hidden = true;
    $('failed').hidden = false;
    if (message) $('failed-reason').textContent = message;
  }

  // ── 서명 칸 ──
  const canvas = $('pad');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let hasInk = false;

  function resizePad() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#191F28';
    clearPad();
  }

  function clearPad() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasInk = false;
    $('pad-hint').hidden = false;
    updateSubmit();
  }

  function point(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', (e) => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const p = point(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = point(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    if (!hasInk) {
      hasInk = true;
      $('pad-hint').hidden = true;
      updateSubmit();
    }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => canvas.addEventListener(type, () => { drawing = false; }));
  $('clear').addEventListener('click', clearPad);
  window.addEventListener('resize', () => { if (!hasInk) resizePad(); });

  function updateSubmit() {
    $('submit').disabled = !hasInk;
  }

  // 서명 위에 흰 바탕을 깐 PNG. 서버는 PNG data URL만 받는다
  function signatureDataUrl() {
    const out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height;
    const o = out.getContext('2d');
    o.fillStyle = '#FFFFFF';
    o.fillRect(0, 0, out.width, out.height);
    o.drawImage(canvas, 0, 0);
    return out.toDataURL('image/png');
  }

  // ── 이상 사항 사진 ──
  function updatePhotoCount() {
    $('photo-count').textContent = photoCount ? ` ${photoCount}/${MAX_PHOTOS}장` : '';
    $('photo-btn').disabled = photoCount >= MAX_PHOTOS;
  }

  $('photo-btn').addEventListener('click', () => $('photo-input').click());
  $('photo-input').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    $('error').textContent = '';
    $('photo-btn').disabled = true;
    $('photo-btn').textContent = '올리는 중…';
    try {
      const form = new FormData();
      form.append('file', file);
      const proof = await request(api + '/photos', { method: 'POST', body: form });
      photoCount = (proof.photos || []).filter((p) => p.type === 'ISSUE').length;
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = '올린 사진';
      $('photos').appendChild(img);
    } catch (err) {
      $('error').textContent = err.message;
    } finally {
      $('photo-btn').textContent = '사진 올리기';
      updatePhotoCount();
    }
  });

  // ── 서명 보내기 ──
  function currentPosition() {
    if (!$('share-location').checked || !navigator.geolocation) return Promise.resolve(null);
    return new Promise((resolve) => {
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 },
      );
    });
  }

  $('sign-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!hasInk) return;
    $('error').textContent = '';
    $('submit').disabled = true;
    $('submit').textContent = '보내는 중…';
    try {
      const position = await currentPosition();
      const proof = await request(api + '/sign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          signerName: $('name').value.trim() || null,
          signature: signatureDataUrl(),
          issueNote: $('note').value.trim() || null,
          lat: position ? position.lat : null,
          lng: position ? position.lng : null,
        }),
      });
      render(proof);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      $('error').textContent = err.message;
      $('submit').textContent = '서명하고 인수 확인';
      updateSubmit();
    }
  });

  // ── 시작 ──
  if (!token) {
    fail();
    return;
  }
  request(api)
    .then((proof) => {
      render(proof);
      if (proof.status === 'PENDING') resizePad();
    })
    .catch((err) => fail(err.message));
})();
</script>
</body>
</html>

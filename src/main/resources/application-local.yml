# 로컬 개발: 내 컴퓨터의 PostgreSQL + PostGIS (ieo DB)
# 처음 한 번: createdb ieo && psql -d ieo -c 'CREATE EXTENSION IF NOT EXISTS postgis'
# 접속 정보가 다르면 DB_URL, DB_USERNAME, DB_PASSWORD 환경변수로 바꾼다 (기본: 내 맥 계정, 비밀번호 없음)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ieo}
    username: ${DB_USERNAME:${USER}}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    com.ieo.server: debug

ieo:
  jwt:
    secret: local-only-secret-change-me-0123456789
  vin:
    hash-secret: local-only-vin-secret-change-me
  # 주선사 웹 콘솔 개발 서버 (Vite 기본 포트)
  cors:
    allowed-origins: http://localhost:5173

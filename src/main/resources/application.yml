# 모든 환경에 공통인 설정. 환경별 설정은 application-{local,dev,prod}.yml
spring:
  application:
    name: ieo-server
  profiles:
    default: local
  # 인수증 사진 업로드 (한 장 5MB, 요청 하나 12MB)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 토큰. secret은 32바이트 이상, 환경변수로 주입 (local·test는 각 파일에 개발용 값)
ieo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
  # 브라우저에서 API를 부를 수 있는 주소. 쉼표로 여러 개 (예: https://console.ieo.kr)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # 차량 VIN 해시용 비밀 키. 환경변수로 주입 (local·test는 각 파일에 개발용 값)
  vin:
    hash-secret: ${VIN_HASH_SECRET}
  # 서명 이미지·사진 저장 폴더 (로컬 디스크). 운영에서는 클라우드 저장소로 바꾼다
  storage:
    local-dir: ${IEO_STORAGE_DIR:./data/files}

# 모든 환경에 공통인 설정. 환경별 설정은 application-{local,dev,prod}.yml
spring:
  application:
    name: ieo-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 토큰. secret은 32바이트 이상, 환경변수로 주입 (local·test는 각 파일에 개발용 값)
ieo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 30d

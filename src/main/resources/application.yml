spring:
  application:
    name: daumjim-server
  profiles:
    default: local
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# 로컬 개발: H2 파일 DB (서버를 재시작해도 데이터 유지)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/daumjim;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

---
# 배포: PostgreSQL (접속 정보는 환경변수로 주입)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

# 모든 환경에 공통인 설정. 환경별 설정은 application-{local,dev,prod}.yml
spring:
  application:
    name: ieo-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

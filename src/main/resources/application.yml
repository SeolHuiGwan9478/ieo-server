# 모든 환경에 공통인 설정. 환경별 설정은 application-{local,dev,prod}.yml
spring:
  application:
    name: ieo-server
  profiles:
    default: local
  # 인수증 사진 업로드 (한 장 5MB, 요청 하나 12MB)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 토큰. secret은 32바이트 이상, 환경변수로 주입 (local·test는 각 파일에 개발용 값)
ieo:
  # 문자에 넣는 공개 링크의 주소. 배포할 때 IEO_PUBLIC_BASE_URL로 넘긴다
  public-base-url: ${IEO_PUBLIC_BASE_URL:http://localhost:8080}
  # 배차 추천 계산 (03). 가안 값이고 docs/design/04_배차추천.md 3장에서 정한다
  recommendation:
    diesel-price-won: 1600        # 경유 1L. 오피넷을 받지 못할 때만 쓴다
    road-factor: 1.3              # 직선거리 → 도로 거리 어림
    long-wait-minutes: 60         # 상차지 평균 대기가 이 이상이면 "대기 길었던 곳"
  # 주소 검색 결과의 좌표 조회. REST API 키는 서버에서만 사용한다
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  # 오피넷 유가정보 (시도별 경유 평균). 키가 없으면 diesel-price-won을 쓴다
  # TMAP 화물차 경로 (거리·통행료). 키가 없으면 직선거리 어림으로 계산한다
  tmap:
    app-key: ${TMAP_APP_KEY:}
  opinet:
    api-key: ${OPINET_API_KEY:}
  # 음성 대답 판별 (UX-025). 차량 앱이 단어 목록으로 못 알아들은 말만 온다. 키나 모델이 비어 있으면 늘 "모름"
  voice:
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:}
  # 리포트에서 노선·상하차지를 보여 주는 최소 건수 (BRK-044). 로컬·테스트는 낮춰 둔다
  report:
    min-samples: 10
  # 상차 가능 시간이 끝난 모집 중 오더를 자동으로 마감한다 (OrderExpireScheduler). 테스트는 끈다
  dispatch:
    auto-expire: true
    expire-interval: PT5M
    expire-initial-delay: PT30S
  # 소셜 로그인. 키가 비어 있으면 그 공급자는 503(AUTH_503_SOCIAL)을 돌려주고 콘솔은 "준비 중"으로 보여 준다
  social:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    kakao:
      rest-api-key: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
  # 브라우저에서 API를 부를 수 있는 주소. 쉼표로 여러 개 (예: https://console.ieo.kr)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # 차량 VIN 해시용 비밀 키. 환경변수로 주입 (local·test는 각 파일에 개발용 값)
  vin:
    hash-secret: ${VIN_HASH_SECRET}
  # 서명 이미지·사진 저장 폴더 (로컬 디스크). 운영에서는 클라우드 저장소로 바꾼다
  storage:
    local-dir: ${IEO_STORAGE_DIR:./data/files}
  # 사업자등록증 진위확인 (국세청, 공공데이터포털 15081808). 키가 없으면 조회하지 않고 운영자가 눈으로만 본다
  # NTS_STUB=true 면 키 없이 시연용 가짜 결과를 쓴다 (사업자번호 아홉째 자리: 0~6 계속사업자, 7 휴업, 8 폐업, 9 불일치)
  nts:
    service-key: ${NTS_SERVICE_KEY:}
    stub: ${NTS_STUB:false}
  # 서류 심사 게이트. 회사 서류가 모두 승인된 주선사만 오더를 올린다 (테스트 프로필은 끈다)
  review:
    gate-broker-orders: true
    # 필수 서류 4종이 모두 승인된 차주만 배차를 요청한다
    gate-driver-requests: true
